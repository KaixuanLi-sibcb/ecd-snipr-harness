interface:
  display_name: "ECD-SNIPR Harness"
  short_description: "Batch antigen-fragment screening and SNIPR receiver candidate design"
  default_prompt: "Use $ecd-snipr-harness to build an analysis set from my target list or a public human membrane-protein query, screen every target into sourced antigen-fragment candidates with per-target screening recommendations, and summarize coverage with explicit denominators. Without our real SNIPR scaffold, deliver candidate fragments and junction notes only — never a guessed fusion."
