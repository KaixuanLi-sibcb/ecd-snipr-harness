interface:
  display_name: "ECD-SNIPR Harness"
  short_description: "Batch antigen-fragment screening and SNIPR receiver candidate design"
  default_prompt: "Use $ecd-snipr-harness to screen a defined human protein set into sourced receiver-antigen fragments and transparent per-target recommendations. Cross-check exact sequence/domain intervals and annotation subjects; use core-evidence for optional accession-only InterPro validation and import-prediction only for actual local predictor outputs. Missing tools are not checked and no conflict is not low functional risk. For historical workbooks, use the private lab-evidence branch: recover every source cell, audit fragment/reference correspondence, propose links without merging constructs, and separate recorded data from confirmed assay semantics. Missing actual scaffold does not block screening or raw intake. Never guess a fusion, transfer outcomes by gene name, or turn Y/N into functional labels."
