name: offline-contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: make all-checks-offline
# Includes portable HPC contracts, not vendor inference or private data.
# Never upload generated run bundles as CI artifacts.
